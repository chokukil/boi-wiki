name: boi-agent-playground-mainline

services:
  content-init:
    image: alpine:3.20
    network_mode: none
    command:
      - sh
      - -eu
      - -c
      - >-
        find /content -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +;
        cp -a /source/. /content/;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-onboarding.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-langflow-setup.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-my-flow-deploy.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-shared-assets.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-action-wiki.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-troubleshooting.md;
        test -f /content/public/boi-wiki-manual/langflow/agent-playground-flow-mcp-usage.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-quickstart.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-canvas.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-connect.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-agent-hub.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-component.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-permissions.md;
        test -f /content/public/boi-wiki-manual/langflow/universal-simulation-mcp-troubleshooting.md;
        test -f /content/public/boi-wiki-manual/operations/agent-hub-integration-boundary.md;
        test -f /content/public/boi-wiki-manual/operations/agent-playground-operator-runbook.md;
        test -f /content/public/boi-wiki-manual/operations/agent-playground-keycloak-request.md;
        test -f /content/public/boi-wiki-manual/operations/agent-playground-caddy-sso-routing.md
    volumes:
      - ../../data/boi:/source:ro
      - content:/content

  catalog-init:
    image: alpine:3.20
    network_mode: none
    command:
      - sh
      - -eu
      - -c
      - >-
        find /catalog -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +;
        cp -a /source/. /catalog/
    volumes:
      - ../../data/action_catalog:/source:ro
      - action-catalog:/catalog

  boi-api:
    build:
      context: ../../boi_api
      args:
        BOI_BUILD_REVISION: ${BOI_BUILD_REVISION:-53912644-agent-playground-mainline}
    ports:
      - "28005:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOI_CONTENT_ROOT: /content
      DATA_ROOT: /content
      BOI_CONTENT_SAFE_DIRECTORY: /content
      BOI_RUNTIME_ROOT: /runtime
      BOI_REPO_ROOT: /workspace
      EVENTS_ROOT: /runtime/events
      ACTION_LOG_ROOT: /runtime/actions
      KAFKA_BOOTSTRAP: event-broker:9092
      EVENT_CATALOG_ROOT: /workspace/data/event_catalog
      ACTION_CATALOG_ROOT: /action_catalog
      WORKFLOW_CATALOG_ROOT: /workspace/data/workflow_catalog
      EVENT_SKILL_CATALOG_ROOT: /workspace/data/event_skill_catalog
      ACTION_SKILL_CATALOG_ROOT: /workspace/data/action_skill_catalog
      AGENT_CATALOG_ROOT: /workspace/data/agent_catalog
      BOI_AUTO_COMMIT: "false"
      BOI_AUTO_PUSH: "false"
      BOI_PET_AGENT_ENABLED: "false"
      BOI_AUTH_MODE: ${BOI_AUTH_MODE:-oidc}
      BOI_EXTERNAL_URL: http://localhost:28005
      BOI_SESSION_SECRET: mainline-validation-session-secret-change-me
      BOI_AGENT_PLAYGROUND_ENCRYPTION_KEY: mainline-validation-encryption-key-change-me
      BOI_AGENT_PLAYGROUND_TOKEN_HASH_SECRET: mainline-validation-token-hash-secret-change-me
      BOI_AGENT_PLAYGROUND_ALLOWED_LANGFLOW_HOSTS: localhost,host.docker.internal
      LANGFLOW_EXTERNAL_URL: http://localhost:17867
      LANGFLOW_DEPLOY_URL: http://host.docker.internal:7867
      LANGFLOW_MCP_EXTERNAL_URL: http://localhost:7867
      # Official 1.11.0 external-JWT browser lifecycle is audited separately.
      # The full local browser gate uses the documented employee-isolated
      # embedded fallback and must report that mode truthfully.
      LANGFLOW_BROWSER_AUTH_MODE: ${LANGFLOW_BROWSER_AUTH_MODE:-embedded_sso}
      LANGFLOW_BROWSER_ISOLATED_EMPLOYEE: ${LANGFLOW_BROWSER_ISOLATED_EMPLOYEE:-100002}
      LANGFLOW_BROWSER_SSO_BLOCKER: ${LANGFLOW_BROWSER_SSO_BLOCKER:-}
      BOI_LANGFLOW_BROWSER_SESSION_COOKIES: _boi_langflow_sso
      AGENT_HUB_EXTERNAL_URL: http://localhost:18080/AgentHub.html
      AGENT_HUB_API_URL: http://host.docker.internal:18001
      BOI_WIKI_MCP_EXTERNAL_URL: http://localhost:18205
      ACTION_GATEWAY_EXTERNAL_URL: http://localhost:18105
      ACTION_GATEWAY_URL: http://action-gateway:8100
      SERVICE_TOKEN: mainline-validation-service-token
      KEYCLOAK_INTERNAL_URL: http://host.docker.internal:18082
      KEYCLOAK_EXTERNAL_SERVER_URL: http://localhost:18082
      KEYCLOAK_ISSUER_URL: http://localhost:18082
      KEYCLOAK_REALM: boi-validation
      KEYCLOAK_CLIENT_ID: boi-wiki
      KEYCLOAK_CLIENT_SECRET: validation-boi-wiki-client-secret
      KEYCLOAK_REDIRECT_URI: http://localhost:28005/auth/callback
      KEYCLOAK_EMPLOYEE_CLAIM: empno
      BOI_OIDC_ISSUER_URL: http://localhost:18082/realms/boi-validation
      BOI_OIDC_INTERNAL_URL: http://host.docker.internal:18082/realms/boi-validation
      BOI_OIDC_CLIENT_ID: boi-wiki
      BOI_OIDC_CLIENT_SECRET: validation-boi-wiki-client-secret
      BOI_OIDC_REDIRECT_URI: http://localhost:28005/auth/callback
      BOI_OIDC_EMPLOYEE_CLAIM: empno
      HCP_AUTHZ_URL: http://host.docker.internal:18083/permissions
      HCP_AUTHZ_CACHE_TTL_SECONDS: "1"
      BOI_LLM_BASE_URL: http://host.docker.internal:1236/v1
      BOI_LLM_MODEL: google/gemma-4-26b-a4b-qat
      BOI_LLM_API_KEY: not-needed
    volumes:
      - content:/content
      - runtime:/runtime
      - action-catalog:/action_catalog
      - ../..:/workspace:ro
    depends_on:
      content-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
      event-broker:
        condition: service_healthy
    networks: [mainline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  boi-api-trusted:
    build:
      context: ../../boi_api
      args:
        BOI_BUILD_REVISION: ${BOI_BUILD_REVISION:-53912644-agent-playground-mainline}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BOI_CONTENT_ROOT: /content
      DATA_ROOT: /content
      BOI_CONTENT_SAFE_DIRECTORY: /content
      BOI_RUNTIME_ROOT: /runtime
      BOI_REPO_ROOT: /workspace
      EVENTS_ROOT: /runtime/events
      ACTION_LOG_ROOT: /runtime/actions
      KAFKA_BOOTSTRAP: event-broker:9092
      EVENT_CATALOG_ROOT: /workspace/data/event_catalog
      ACTION_CATALOG_ROOT: /action_catalog
      WORKFLOW_CATALOG_ROOT: /workspace/data/workflow_catalog
      EVENT_SKILL_CATALOG_ROOT: /workspace/data/event_skill_catalog
      ACTION_SKILL_CATALOG_ROOT: /workspace/data/action_skill_catalog
      AGENT_CATALOG_ROOT: /workspace/data/agent_catalog
      BOI_AUTO_COMMIT: "false"
      BOI_AUTO_PUSH: "false"
      BOI_PET_AGENT_ENABLED: "false"
      BOI_AUTH_MODE: trusted_header
      BOI_EXTERNAL_URL: http://localhost:28006
      BOI_SESSION_SECRET: mainline-validation-session-secret-change-me
      BOI_AGENT_PLAYGROUND_ENCRYPTION_KEY: mainline-validation-encryption-key-change-me
      BOI_AGENT_PLAYGROUND_TOKEN_HASH_SECRET: mainline-validation-token-hash-secret-change-me
      BOI_AGENT_PLAYGROUND_ALLOWED_LANGFLOW_HOSTS: localhost,host.docker.internal
      BOI_TRUSTED_EMPLOYEE_HEADER: X-BoI-Employee-ID
      BOI_TRUSTED_NAME_HEADER: X-BoI-Name
      BOI_TRUSTED_EMAIL_HEADER: X-BoI-Email
      BOI_TRUSTED_TEAMS_HEADER: X-BoI-Teams
      BOI_TRUSTED_PROXY_SECRET_HEADER: X-BoI-Proxy-Secret
      BOI_TRUSTED_PROXY_SHARED_SECRET: validation-trusted-proxy-secret
      BOI_TRUSTED_PROXY_CIDRS: 0.0.0.0/0
      LANGFLOW_EXTERNAL_URL: http://localhost:17870
      LANGFLOW_DEPLOY_URL: http://host.docker.internal:7867
      LANGFLOW_MCP_EXTERNAL_URL: http://localhost:7867
      LANGFLOW_BROWSER_AUTH_MODE: embedded_sso
      LANGFLOW_BROWSER_ISOLATED_EMPLOYEE: "100002"
      LANGFLOW_BROWSER_SSO_BLOCKER: official Langflow 1.11 external JWT browser lifecycle qualification pending
      AGENT_HUB_EXTERNAL_URL: http://localhost:18080/AgentHub.html
      AGENT_HUB_API_URL: http://host.docker.internal:18001
      BOI_WIKI_MCP_EXTERNAL_URL: http://localhost:18205
      ACTION_GATEWAY_EXTERNAL_URL: http://localhost:18105
      ACTION_GATEWAY_URL: http://action-gateway:8100
      SERVICE_TOKEN: mainline-validation-service-token
      HCP_AUTHZ_URL: http://host.docker.internal:18083/permissions
      HCP_AUTHZ_CACHE_TTL_SECONDS: "1"
      BOI_LLM_BASE_URL: http://host.docker.internal:1236/v1
      BOI_LLM_MODEL: google/gemma-4-26b-a4b-qat
      BOI_LLM_API_KEY: not-needed
    volumes:
      - content:/content
      - runtime:/runtime
      - action-catalog:/action_catalog
      - ../..:/workspace:ro
    depends_on:
      content-init:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
      event-broker:
        condition: service_healthy
    networks: [mainline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  mock-corporate-gateway:
    build:
      context: ./mock_gateway
    ports:
      - "28006:8080"
    environment:
      MOCK_GATEWAY_UPSTREAM: http://boi-api-trusted:8000
      MOCK_GATEWAY_SESSION_SECRET: validation-mock-corporate-session-secret
      MOCK_GATEWAY_PROXY_SHARED_SECRET: validation-trusted-proxy-secret
      MOCK_GATEWAY_BRIDGE_URL: http://sso-token-bridge:8080
    depends_on:
      boi-api-trusted:
        condition: service_healthy
      sso-token-bridge:
        condition: service_healthy
    networks: [mainline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-corporate-langflow-gateway:
    build:
      context: ./mock_gateway
    ports:
      - "17870:8080"
    environment:
      MOCK_GATEWAY_UPSTREAM: http://boi-agent-playground-mainline-langflow:7860
      MOCK_GATEWAY_SESSION_SECRET: validation-mock-corporate-session-secret
      MOCK_GATEWAY_PROXY_SHARED_SECRET: validation-trusted-proxy-secret
      MOCK_GATEWAY_BRIDGE_URL: http://sso-token-bridge:8080
      MOCK_GATEWAY_ALLOWED_EMPLOYEES: "100002"
      MOCK_GATEWAY_INJECT_BRIDGE_JWT: "true"
    depends_on:
      sso-token-bridge:
        condition: service_healthy
    networks: [mainline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  langflow-browser-sso:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.10.0
    ports:
      - "17867:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Company SSO
      OAUTH2_PROXY_CLIENT_ID: boi-wiki
      OAUTH2_PROXY_CLIENT_SECRET: validation-boi-wiki-client-secret
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:18082/realms/boi-validation
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:18082/realms/boi-validation/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://host.docker.internal:18082/realms/boi-validation/protocol/openid-connect/token
      OAUTH2_PROXY_PROFILE_URL: http://host.docker.internal:18082/realms/boi-validation/protocol/openid-connect/userinfo
      OAUTH2_PROXY_OIDC_JWKS_URL: http://host.docker.internal:18082/realms/boi-validation/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:17867/oauth2/callback
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_UPSTREAMS: ${LANGFLOW_BROWSER_UPSTREAM:-http://boi-agent-playground-mainline-langflow:7860/}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_NAME: _boi_langflow_sso
      OAUTH2_PROXY_COOKIE_SECRET: ${LANGFLOW_BROWSER_COOKIE_SECRET:-Ym9pLWxhbmdmbG93LXNzby1jb29raWUtc2VjcmV0ISE=}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROXY_WEBSOCKETS: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:17867,localhost:28005
    volumes:
      - ./langflow-browser-allowed-emails.txt:/etc/oauth2-proxy/allowed-emails.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      boi-api:
        condition: service_healthy
    networks: [mainline]
    healthcheck:
      test: ["CMD", "/bin/oauth2-proxy", "--version"]
      interval: 10s
      timeout: 5s
      retries: 12

  sso-token-bridge:
    build:
      context: ../../sso_token_bridge
    environment:
      SSO_BRIDGE_ALLOW_EPHEMERAL_KEY: "true"
      SSO_BRIDGE_PROXY_SHARED_SECRET: validation-trusted-proxy-secret
      SSO_BRIDGE_TRUSTED_PROXY_CIDRS: 0.0.0.0/0
      SSO_BRIDGE_ISSUER: boi-validation-sso-bridge
      SSO_BRIDGE_AUDIENCE: boi-wiki
      SSO_BRIDGE_TOKEN_TTL_SECONDS: "60"
    networks: [mainline]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  langflow-loopback:
    image: alpine/socat:1.8.0.0
    network_mode: "service:boi-api"
    command:
      - TCP-LISTEN:7867,bind=127.0.0.1,fork,reuseaddr
      - TCP:boi-agent-playground-mainline-langflow:7860
    depends_on:
      boi-api:
        condition: service_healthy

  recovery-gate-loopback:
    image: alpine/socat:1.8.0.0
    network_mode: "service:boi-api"
    command:
      - TCP-LISTEN:17866,bind=127.0.0.1,fork,reuseaddr
      - TCP:${BOI_VALIDATION_HOST_GATEWAY:-192.168.65.254}:17866
    depends_on:
      boi-api:
        condition: service_healthy

  unsupported-gate-loopback:
    image: alpine/socat:1.8.0.0
    network_mode: "service:boi-api"
    command:
      - TCP-LISTEN:17865,bind=127.0.0.1,fork,reuseaddr
      - TCP:${BOI_VALIDATION_HOST_GATEWAY:-192.168.65.254}:17865
    depends_on:
      boi-api:
        condition: service_healthy

  event-broker:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://event-broker:9092
    networks: [mainline]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "127.0.0.1:9092"]
      interval: 5s
      timeout: 5s
      retries: 30

  action-gateway:
    build:
      context: ../../action_gateway
    ports:
      - "18105:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVICE_TOKEN: mainline-validation-service-token
      BOI_API_URL: http://boi-api:8000
      BOI_API_SERVICE_TOKEN: mainline-validation-service-token
      ACTION_CATALOG_ROOT: /action_catalog
      ACTION_LOG_ROOT: /runtime/actions
      LANGFLOW_URL: http://host.docker.internal:7867
      LANGFLOW_AUTH_MODE: api-key
      BOI_WIKI_MCP_URL: http://boi-wiki-mcp:8200/mcp/v2
      ALLOWED_ACTION_HOSTS: boi-api,boi-wiki-mcp,host.docker.internal,localhost,127.0.0.1
    volumes:
      - ../..:/workspace:ro
      - runtime:/runtime
      - action-catalog:/action_catalog
    depends_on:
      boi-api:
        condition: service_healthy
    networks: [mainline]

  boi-wiki-mcp:
    build:
      context: ../../boi_wiki_mcp
    ports:
      - "18205:8200"
    environment:
      BOI_API_URL: http://boi-api:8000
      SERVICE_TOKEN: mainline-validation-service-token
      MCP_V2_REQUIRE_PAT: "true"
      BOI_WIKI_MCP_EXTERNAL_URL: http://localhost:18205
      MCP_ALLOWED_HOSTS: localhost:18205,host.docker.internal:18205,boi-wiki-mcp:8200
      MCP_ALLOWED_ORIGINS: http://localhost:18205,http://host.docker.internal:18205
    depends_on:
      boi-api:
        condition: service_healthy
    networks: [mainline]

volumes:
  content:
    name: boi-agent-playground-mainline-content
  runtime:
    name: boi-agent-playground-mainline-runtime
  action-catalog:
    name: boi-agent-playground-mainline-action-catalog

networks:
  mainline:
    external: true
    name: ${BOI_AGENT_PLAYGROUND_VALIDATION_NETWORK:-boi-langflow-111-validation-net}
