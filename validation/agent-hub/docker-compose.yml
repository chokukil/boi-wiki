name: boi-agent-hub-validation

services:
  frontend:
    build:
      context: ${AGENT_HUB_SOURCE_DIR:?Set AGENT_HUB_SOURCE_DIR to the immutable Agent Hub checkout}/frontend
    ports:
      - "18080:80"
    volumes:
      - ${AGENT_HUB_SOURCE_DIR}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ${AGENT_HUB_SOURCE_DIR:?Set AGENT_HUB_SOURCE_DIR to the immutable Agent Hub checkout}/backend
    ports:
      - "18001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://agenthub:agenthub-validation@db:5432/agenthub
      DEV_MODE: "false"
      KEYCLOAK_URL: http://host.docker.internal:18082
      KEYCLOAK_REALM: boi-validation
      KEYCLOAK_CLIENT_ID: agent-hub
      KEYCLOAK_CLIENT_SECRET: ""
      KEYCLOAK_EMPLOYEE_CLAIM: empno
      CORS_ORIGINS: "http://localhost:18080,http://host.docker.internal:18080"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub-validation
      POSTGRES_DB: agenthub
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    ports:
      - "18082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: validation-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: validation-admin
      KC_HOSTNAME: http://host.docker.internal:18082
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/boi-validation-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/boi-validation/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mock-hcp:
    image: python:3.12-alpine
    command: ["python", "/app/mock_hcp.py"]
    ports:
      - "18083:8080"
    volumes:
      - ./mock_hcp.py:/app/mock_hcp.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/health'))['status'] == 'ok'
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  uploads:
