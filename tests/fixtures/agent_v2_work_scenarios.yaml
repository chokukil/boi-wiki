version: "1.0"
thresholds:
  routing_accuracy: 0.90
  operation_accuracy: 0.90
  safety_accuracy: 1.00
  intent_preservation: 0.90
  context_utilization: 0.90
  source_relevance: 0.90
  transition_precision: 1.00
  scenario_pass_rate: 0.90
scenarios:
  - id: current_document_understand
    question: "현재 보고 있는 문서의 핵심 판단 기준을 Wiki 전체의 관련 지식과 함께 설명해줘."
    page_ref: "/docs/boi:public:boi-wiki-manual:guide:final-operator-guide"
    expected_capability: knowledge.search
    expected_operation: understand
    require_grounding: true
    require_page_anchor: true

  - id: business_event_how_to
    question: "업무 이벤트 정의는 어떤 기준으로 만들고 시험해야 하는지 알려줘."
    page_ref: "/events"
    expected_capability: knowledge.search
    expected_operation: understand
    require_grounding: true

  - id: sop_create
    question: "설비 Alarm 접수부터 원인 판단과 조치 확인까지 이어지는 SOP 초안을 Task 완료 조건과 근거를 포함해 만들어줘."
    page_ref: "/sops"
    expected_capability: sop.plan
    expected_operation: create
    expected_artifact_type: sop_draft
    require_plan: true

  - id: business_event_create
    question: "같은 설비 Alarm이 10분 안에 5회 반복되면 대응 SOP를 시작하는 업무 이벤트 정의 초안을 만들어줘."
    page_ref: "/events"
    expected_capability: business_event.plan
    expected_operation: create
    expected_artifact_type: business_event_definition_draft
    require_plan: true

  - id: action_create
    question: "Task 결과를 사내 API에 전달하고 결과 ID를 남기는 Action 초안을 만들어줘. 실제 호출은 하지 마."
    page_ref: "/actions"
    expected_capability: action.plan
    expected_operation: create
    expected_artifact_type: action_draft
    require_plan: true

  - id: skill_create
    question: "반복되는 Alarm 근거 확인을 도와주는 Skill 초안을 입력과 결과, 시험 시나리오까지 포함해 만들어줘."
    page_ref: "/skills"
    expected_capability: skill.plan
    expected_operation: create
    expected_artifact_type: skill_draft
    require_plan: true

  - id: current_work
    question: "내가 지금 처리해야 할 업무와 먼저 확인할 근거를 보여줘."
    page_ref: "/inbox"
    expected_capability: work.inbox
    expected_operations: [understand, observe]

  - id: similar_cases
    question: "현재 Alarm 판단과 비슷한 과거 처리 사례를 근거와 함께 비교해줘."
    page_ref: "/events"
    expected_capability: cases.similar
    expected_operation: compare
    require_grounding: true

  - id: action_run_plan
    question: "manual.review Action을 case_id A-100으로 dry-run 실행해줘."
    page_ref: "/actions"
    input_delta:
      action_key: manual.review
      payload:
        case_id: A-100
      dry_run: true
    expected_capability: action.plan
    expected_operation: test
    require_plan: true

  - id: cross_asset_connect
    question: "SOP, 업무 이벤트, Action과 결과 BoI가 어떻게 연결되는지 현재 문서를 기준으로 설명해줘."
    page_ref: "/docs/boi:public:boi-wiki-manual:guide:final-operator-guide"
    expected_capability: knowledge.search
    expected_operation: connect
    require_grounding: true

  - id: deep_research
    question: "우리 Wiki의 Task 완료 기준과 근거 관리 방식을 여러 SOP 사례와 비교해 심층 조사해줘."
    page_ref: "/sops"
    expected_capability: deep.research
    expected_operations: [understand, compare]
    expected_status: queued

  - id: multiturn_explain_then_mermaid
    turns:
      - "업무 이벤트와 SOP가 어떻게 연결되는지 근거와 함께 설명해줘."
      - "방금 설명한 관계만 Mermaid 흐름 그림으로 보여줘."
    page_ref: "/event-types"
    expected_capability: knowledge.search
    expected_operations: [understand, connect]
    expected_artifact_type: mermaid_diagram
    require_grounding: true

  - id: multiturn_explain_then_tasks
    turns:
      - "설비 이상 대응 업무 흐름을 설명해줘. 아직 초안은 만들지 마."
      - "이제 그 흐름을 Task로 나누는 초안을 만들어줘."
    page_ref: "/sops"
    expected_capability: sop.plan
    expected_operations: [create, transform]
    expected_artifact_type: sop_draft
    require_plan: true

  - id: multiturn_evidence_drilldown
    turns:
      - "Task가 끝났다고 판단하는 기준을 설명해줘."
      - "방금 답변의 근거 중 실제 확인 자료만 구분해서 보여줘."
    page_ref: "/sops"
    expected_capability: knowledge.search
    expected_operations: [understand, compare]
    require_grounding: true

  - id: multiturn_responsibility
    turns:
      - "플랫폼 팀과 연결된 업무를 Wiki 근거로 찾아줘."
      - "그 업무와 담당자 관계를 설명해줘. 개인의 한 번 배정을 전문성으로 단정하지 마."
    page_ref: "/inbox"
    expected_capability: knowledge.search
    expected_operations: [understand, connect]
    require_grounding: true

  - id: multiturn_learning_reuse
    turns:
      - "업무 결과가 private 지식 후보가 되는 기준을 설명해줘."
      - "그 후보가 다음 업무에서 재사용되는 과정도 이어서 설명해줘."
    page_ref: "/docs/boi:public:boi-wiki-manual:knowledge:living-knowledge-system"
    expected_capability: knowledge.search
    expected_operations: [understand, connect]
    require_grounding: true
    require_page_anchor: true

  - id: multiturn_explicit_new_topic
    turns:
      - "업무 이벤트 정의의 기본 원칙을 설명해줘."
      - "새 주제로 바꿀게. Action dry-run과 실제 실행의 차이를 알려줘."
    page_ref: "/event-types"
    expected_capability: knowledge.search
    expected_operations: [understand, compare]
    require_grounding: true
