version: "1.0"
expected_scenarios: 50
thresholds:
  deterministic_pass_rate: 1.0
  live_scenario_pass_rate: 0.90
  citation_integrity: 1.0
  intent_preservation: 0.90
  context_utilization: 0.90
  unauthorized_mutations: 0
groups:
  task:
    - {id: task_manual_progress, contract: progress_record_is_shared, handler: "tests/test_task_ontology_a2ui.py::test_task_work_record_progress_blocker_and_completion_contract"}
    - {id: task_manual_blocked, contract: blocker_and_next_work_are_preserved, handler: "tests/test_task_ontology_a2ui.py::test_task_work_record_progress_blocker_and_completion_contract"}
    - {id: task_manual_missing_evidence, contract: completion_requires_evidence, handler: "tests/test_task_ontology_a2ui.py::test_task_work_record_progress_blocker_and_completion_contract"}
    - {id: task_manual_complete, contract: complete_requires_action_decision_and_checks, handler: "tests/test_task_ontology_a2ui.py::test_multi_assignee_task_is_projected_to_each_inbox_and_completes_once"}
    - {id: task_copilot_human_decision, contract: ai_output_alone_cannot_complete, handler: "tests/test_task_ontology_a2ui.py::test_copilot_requires_human_decision_and_autopilot_rejects_human_record"}
    - {id: task_autopilot_system_only, contract: human_work_record_is_rejected, handler: "tests/test_task_ontology_a2ui.py::test_copilot_requires_human_decision_and_autopilot_rejects_human_record"}
    - {id: task_multi_assignee, contract: any_assignee_completes_shared_task, handler: "tests/test_task_ontology_a2ui.py::test_multi_assignee_task_is_projected_to_each_inbox_and_completes_once"}
    - {id: task_reviewer_assignment, contract: reviewer_can_update_assignment, handler: "tests/test_task_ontology_a2ui.py::test_assignment_revision_reviewer_and_unassigned_access"}
    - {id: task_assignment_conflict, contract: stale_revision_returns_409, handler: "tests/test_task_ontology_a2ui.py::test_assignment_revision_reviewer_and_unassigned_access"}
    - {id: task_evidence_acl, contract: inaccessible_evidence_blocks_completion, handler: "tests/test_task_ontology_a2ui.py::test_task_work_record_progress_blocker_and_completion_contract"}
  graph:
    - {id: graph_neighbors, query_kind: neighbors, expected_presentation: list, handler: "tests/test_agent_v2.py::test_universal_graph_query_kinds_keep_acl_provenance_and_auto_presentation"}
    - {id: graph_path, query_kind: path, expected_presentation: mermaid, handler: "tests/test_agent_v2.py::test_graph_path_and_temporal_filter_are_parameterized_and_deterministic"}
    - {id: graph_workflow, query_kind: workflow, expected_presentation: mermaid, handler: "tests/test_agent_v2.py::test_universal_graph_query_kinds_keep_acl_provenance_and_auto_presentation"}
    - {id: graph_impact, query_kind: impact, expected_presentation: list, handler: "tests/test_agent_v2.py::test_graph_query_kinds_have_distinct_semantic_contracts"}
    - {id: graph_lineage, query_kind: lineage, expected_presentation: mermaid, handler: "tests/test_agent_v2.py::test_graph_query_kinds_have_distinct_semantic_contracts"}
    - {id: graph_responsibility, query_kind: responsibility, expected_presentation: list, handler: "tests/test_agent_v2.py::test_responsibility_graph_does_not_expand_through_a_shared_team_to_other_people"}
    - {id: graph_timeline, query_kind: timeline, expected_presentation: timeline, handler: "tests/test_agent_v2.py::test_graph_path_and_temporal_filter_are_parameterized_and_deterministic"}
    - {id: graph_compare, query_kind: compare, expected_presentation: list, handler: "tests/test_agent_v2.py::test_graph_query_kinds_have_distinct_semantic_contracts"}
    - {id: graph_tour, query_kind: tour, expected_presentation: list, handler: "tests/test_agent_v2.py::test_graph_query_kinds_have_distinct_semantic_contracts"}
    - {id: graph_acl_temporal_incremental, query_kind: neighbors, expected_presentation: list, handler: "tests/test_task_ontology_a2ui.py::test_memory_ontology_incremental_upsert_preserves_unaffected_nodes_and_removes_tombstones"}
  a2ui:
    - {id: a2ui_catalog_allowlist, contract: only_trusted_components, handler: "tests/test_task_ontology_a2ui.py::test_a2ui_compiler_only_emits_trusted_catalog_components_and_keeps_fallback"}
    - {id: a2ui_script_rejected, contract: script_and_event_handlers_are_rejected, handler: "tests/test_task_ontology_a2ui.py::test_a2ui_validator_rejects_untrusted_components_html_urls_and_events"}
    - {id: a2ui_external_url_rejected, contract: external_urls_are_rejected, handler: "tests/test_task_ontology_a2ui.py::test_a2ui_validator_rejects_untrusted_components_html_urls_and_events"}
    - {id: a2ui_event_rejected, contract: unregistered_events_are_rejected, handler: "tests/test_task_ontology_a2ui.py::test_a2ui_validator_rejects_untrusted_components_html_urls_and_events"}
    - {id: a2ui_surface_restore_acl, contract: surfaces_are_owner_scoped, handler: "tests/test_task_ontology_a2ui.py::test_task_console_is_rendered_from_a_valid_stored_a2ui_work_form"}
    - {id: a2ui_typed_fallback, contract: invalid_surface_keeps_typed_response, handler: "tests/test_task_ontology_a2ui.py::test_a2ui_compiler_only_emits_trusted_catalog_components_and_keeps_fallback"}
  learning:
    - {id: learning_completion_candidate, contract: completion_creates_candidate, handler: "tests/test_agent_v2.py::test_work_run_requires_human_completion_and_reuses_the_result_as_private_knowledge"}
    - {id: learning_private_reuse, contract: accepted_private_knowledge_is_retrievable, handler: "tests/test_agent_v2.py::test_full_learning_cycle_promotes_reindexes_and_reuses_authoritative_knowledge_in_new_session"}
    - {id: learning_duplicate_proposal, contract: duplicate_does_not_overwrite_canonical, handler: "tests/test_agent_v2.py::test_living_knowledge_sources_data_artifacts_graph_and_review_boundary"}
    - {id: learning_contradiction_proposal, contract: contradiction_requires_review, handler: "tests/test_agent_v2.py::test_living_knowledge_sources_data_artifacts_graph_and_review_boundary"}
    - {id: parity_web_rest_mcp, contract: interfaces_share_semantic_ids, handler: "tests/test_agent_v2.py::test_identical_cross_interface_turns_reuse_the_same_semantic_route_and_evidence"}
    - {id: context_navigation_exclusion, contract: navigation_deprecated_smoke_seed_are_excluded, handler: "tests/test_boi_api_routes.py::test_navigation_index_redirects_to_folder_and_is_not_agent_context"}
  harness_improvement:
    - {id: harness_causal_failure_pattern, contract: same_cause_is_grouped_without_rewriting_history, handler: "tests/test_agent_v2.py::test_same_causal_harness_failure_is_grouped_as_a_recurrent_pattern"}
    - {id: harness_context_playbook_scope, contract: playbook_is_deduplicated_versioned_and_model_scoped, handler: "tests/test_agent_v2.py::test_context_playbook_is_deduplicated_versioned_and_model_scoped"}
    - {id: harness_shadow_required, contract: evaluation_requires_server_shadow_preflight, handler: "tests/test_agent_v2.py::test_harness_candidate_requires_held_out_and_human_review_before_any_production_change"}
    - {id: harness_immutable_boundary, contract: permissions_and_safety_are_not_editable_surfaces, handler: "tests/test_agent_v2.py::test_harness_candidate_cannot_change_immutable_safety_boundaries"}
    - {id: harness_negative_result, contract: no_progress_and_rejected_candidates_are_preserved, handler: "tests/test_agent_v2.py::test_no_progress_is_preserved_as_a_negative_result"}
    - {id: harness_operational_ontology, contract: failure_candidate_eval_and_playbook_relations_are_admin_only, handler: "tests/test_agent_v2.py::test_harness_improvement_relations_are_compiled_into_admin_ontology"}
  integration_completion:
    - {id: harness_review_page, contract: candidate_opens_rendered_review_surface, handler: "tests/test_task_ontology_a2ui.py::test_harness_candidate_opens_rendered_review_page_instead_of_raw_surface"}
    - {id: harness_release_rehearsal, contract: rehearsal_never_changes_active_binding, handler: "tests/test_agent_v2.py::test_harness_candidate_requires_held_out_and_human_review_before_any_production_change"}
    - {id: harness_manual_release, contract: approved_version_becomes_active_only_after_confirmation, handler: "tests/test_agent_v2.py::test_harness_candidate_requires_held_out_and_human_review_before_any_production_change"}
    - {id: harness_rollback, contract: active_version_can_return_to_builtin_version, handler: "tests/test_agent_v2.py::test_harness_candidate_requires_held_out_and_human_review_before_any_production_change"}
    - {id: adapter_graphify_cli, contract: graphify_cli_export_is_normalized_with_provenance, handler: "tests/test_agent_v2.py::test_graphify_adapter_executes_cli_when_export_is_not_prebuilt"}
    - {id: adapter_openkb_cli, contract: openkb_pages_become_private_review_candidates, handler: "tests/test_agent_v2.py::test_openkb_adapter_executes_cli_and_excludes_navigation_pages"}
    - {id: adapter_cancel, contract: running_adapter_job_can_be_cancelled, handler: "tests/test_agent_v2.py::test_knowledge_source_job_is_async_and_can_be_cancelled"}
    - {id: adapter_retry, contract: failed_adapter_job_retries_from_durable_queue, handler: "tests/test_agent_v2.py::test_failed_adapter_job_retries_from_the_durable_queue"}
    - {id: adapter_restart_resume, contract: running_job_is_requeued_after_restart, handler: "tests/test_agent_v2.py::test_adapter_running_job_is_requeued_after_restart"}
    - {id: adapter_rollback, contract: imported_graph_or_candidates_can_be_removed_without_canonical_change, handler: "tests/test_agent_v2.py::test_graphify_adapter_imports_provenance_graph_without_changing_canonical_files"}
    - {id: work_learning_full_cycle, contract: task_completion_candidate_reindex_and_new_session_reuse, handler: "tests/test_agent_v2.py::test_full_learning_cycle_promotes_reindexes_and_reuses_authoritative_knowledge_in_new_session"}
    - {id: interface_parity_full_cycle, contract: web_rest_mcp_share_work_run_and_learning_ids, handler: "tests/test_agent_v2.py::test_identical_cross_interface_turns_reuse_the_same_semantic_route_and_evidence"}
multiturn:
  - id: followup_graph
    turns: ["업무 이벤트와 SOP 관계를 설명해줘", "그 관계만 흐름 그림으로 보여줘"]
  - id: followup_task_transform
    turns: ["설비 이상 대응 흐름을 설명해줘", "이 흐름을 Task로 나눠줘"]
  - id: followup_evidence
    turns: ["Task 완료 기준을 알려줘", "방금 근거 중 실제 확인 자료만 보여줘"]
  - id: followup_person_responsibility
    turns: ["플랫폼 팀이 맡은 업무를 보여줘", "그중 최근 완료된 일과 담당자를 연결해줘"]
  - id: followup_learning
    turns: ["이번 업무 결과를 private 지식 후보로 남겨줘", "새 작업에서 그 내용을 다시 찾아줘"]
  - id: followup_new_topic
    turns: ["업무 이벤트 정의를 설명해줘", "새 주제로 Action dry-run 기준을 알려줘"]
