version: "2.0"
graph_query_filter_contract:
  filter_policy: explicit_only
  node_kinds:
    - document
    - dictionary
    - concept
    - sop
    - workflow
    - task
    - event
    - business_event
    - event_occurrence
    - workflow_run
    - task_run
    - action
    - action_run
    - skill
    - evidence
    - evidence_ledger
    - external_work_result
    - output_artifact
    - outcome
    - next_event
    - data_artifact
    - person
    - team
    - role
    - work_record
    - completion_record
    - knowledge_candidate
    - runtime
    - runtime_catalog
    - code_entity
  relation_kinds:
    - part_of
    - guides
    - uses
    - triggers
    - executes
    - part_of_workflow
    - has_task
    - next_task
    - precedes
    - uses_sop
    - uses_event
    - uses_action
    - uses_skill
    - triggered_by
    - results_in
    - produces
    - assigned_to
    - reviewed_by
    - related_team
    - member_of
    - has_role
    - performed_by
    - completed_by
    - repeated_performer
    - requires_evidence
    - derived_from
    - evidence
    - broader
    - narrower
    - related
    - links_to
    - supersedes
loop_contract_templates:
  bounded_turn: &bounded_turn
    kind: turn
    trigger: user
    task_stop: agent_done
    routine_stop: one_shot
    max_iterations: 1
    max_no_progress: 2
    max_tool_loops: 1
    max_model_calls: 2
    max_elapsed_seconds: 15
    max_context_tokens: 16384
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
  bounded_goal: &bounded_goal
    kind: goal
    trigger: user
    task_stop: exit_criteria
    routine_stop: one_shot
    max_iterations: 5
    max_no_progress: 2
    max_tool_loops: 5
    max_model_calls: 8
    max_elapsed_seconds: 900
    max_context_tokens: 0
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
  deep_goal: &deep_goal
    kind: goal
    trigger: user
    task_stop: exit_criteria
    routine_stop: one_shot
    max_iterations: 5
    max_no_progress: 2
    max_tool_loops: 5
    max_model_calls: 12
    max_elapsed_seconds: 3600
    max_context_tokens: 0
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
asset_defaults:
  knowledge: knowledge.search
  sop: sop.plan
  workflow: workflow.transform
  task: task.work
  business_event: business_event.plan
  action: action.plan
  skill: skill.plan
  runtime: work.inbox
  evidence: cases.similar
legacy_import:
  capability_aliases:
    search: knowledge.search
    summarize: knowledge.search
    validate: cases.similar
    diagram: sop.plan
    draft: knowledge.draft
    request_action: action.plan
    sop: sop.plan
    event: business_event.plan
    knowledge.deep: deep.research
  source_scope_aliases:
    boi_docs: boi
    sops: sop
    events_actions: event
    similar_cases: history
  required_capabilities: [knowledge.search]
helper_templates:
  - template_id: search
    name: 자료 찾기 도우미
    instructions: 질문과 관련된 검토된 BoI 자료를 먼저 찾고, 근거 링크와 함께 간결하게 답합니다.
    capability_ids: [knowledge.search, cases.similar]
  - template_id: sop
    name: SOP 설계 도우미
    instructions: 업무 목표를 Task로 나누고 각 Task의 목적, 종료 기준, 필요한 근거를 구체화합니다.
    capability_ids: [knowledge.search, sop.plan, action.plan, business_event.plan]
  - template_id: evidence
    name: 근거 검증 도우미
    instructions: 주장의 근거를 BoI Wiki와 유사 사례에서 확인하고, 부족한 근거와 다음 확인 항목을 구분합니다.
    capability_ids: [knowledge.search, cases.similar, knowledge.draft]
  - template_id: blank
    name: 새 BoI Agent
    instructions: ""
    capability_ids: [knowledge.search]
capabilities:
  - capability_id: knowledge.search
    title: 업무 지식 찾기
    description: 빠른 질문, 현재 문서 설명, 관계 확인에 필요한 BoI 문서·SOP·Event·Action·Skill을 함께 찾습니다.
    primary_asset: knowledge
    supported_assets: [knowledge, sop, workflow, task, business_event, action, skill, runtime, evidence]
    subject_kinds: [knowledge, concept, dictionary, document, sop, workflow, workflow_run, task, task_run, business_event, event, event_occurrence, action, action_run, skill, runtime, runtime_catalog, evidence, evidence_ledger, external_work_result, output_artifact, person, team, org_unit, company, role, responsibility, outcome, next_event, usage_record, agent_definition, agent_deployment, system, data_artifact, work_record, completion_record, knowledge_candidate, case]
    examples: [찾아줘, 검색, 관련 문서, 무엇인지 알려줘, 업무 지식]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, compare, connect, validate, observe]
    semantic_compile:
      priority: 10
      preferred_subject_kinds: [knowledge, concept, document, sop, workflow, workflow_run, task, task_run, business_event, event, event_occurrence, action, action_run, skill, evidence_ledger, external_work_result, output_artifact, person, team, org_unit, company, role, responsibility, outcome, next_event, usage_record, agent_definition, agent_deployment, system]
      evidence_modes: [current_work, relationship_provenance, authoritative_knowledge, private_learning, execution_evidence]
      evidence_modes_by_operation:
        validate: [private_learning, execution_evidence]
      evidence_scopes_by_operation:
        validate: [operational, validation]
      evidence_scopes_by_mode:
        authoritative_knowledge: [canonical]
        current_work: [operational]
        execution_evidence: [operational]
        relationship_provenance: [canonical, operational]
      evidence_authorities_by_mode:
        authoritative_knowledge: [reviewed, published, active, approved, canonical]
        relationship_provenance: [reviewed, published, active, approved, canonical, runtime]
        private_learning: [provisional, reviewed]
      evidence_statuses_by_mode:
        authoritative_knowledge: [reviewed, published, active, approved, final]
        relationship_provenance: [reviewed, published, active, approved, final]
        private_learning: [provisional, reviewed]
      work_perspectives: [current, responsibility]
      work_perspective_subject_kinds: [person, team, role, task, runtime, action, work_record]
      work_perspective_subject_kinds_by_perspective:
        current: [person, team, task, runtime, action, work_record, business_event, event, event_occurrence]
        responsibility: [person, team, org_unit, company, role, responsibility]
      mutation_intents: [none]
      loop_intents: [turn]
      presentation_operation_aliases: {mermaid: connect, explorer: connect}
      default_graph_query_by_operation: {compare: compare, connect: neighbors, validate: lineage}
      default_graph_query_by_presentation: {timeline: timeline}
      default_graph_query_by_evidence_mode: {execution_evidence: neighbors}
      default_graph_query_by_work_view: {responsibility: responsibility, combined: responsibility}
      ontology_projection_recipes_by_evidence_mode:
        relationship_provenance:
          task:
            - projection_id: task_context_lineage
              evidence_category: relationship
              required_for_answer: true
              empty_message: 이 Task와 연결된 Event·Evidence·Action 관계를 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: workflow}
        execution_evidence:
          person:
            - projection_id: person_tools
              evidence_category: usage
              required_for_answer: true
              empty_message: 검증된 Agent·System 업무 사용 기록을 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: usage}
            - projection_id: person_outcomes
              evidence_category: verified_outcome
              required_for_answer: true
              empty_message: 검증된 업무 결과나 Outcome 기록을 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: usage}
          agent_definition:
            - projection_id: agent_adoption
              evidence_category: usage
              required_for_answer: true
              empty_message: 이 Agent를 사용한 사람·팀의 검증 기록을 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: usage}
          agent_deployment:
            - projection_id: agent_adoption
              evidence_category: usage
              required_for_answer: true
              empty_message: 이 Agent 배포를 사용한 사람·팀의 검증 기록을 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: usage}
          system:
            - projection_id: system_adoption
              evidence_category: usage
              required_for_answer: true
              empty_message: 이 System을 사용한 사람·팀의 검증 기록을 확인할 수 없습니다.
              primary_graph_mode: projection_only
              graph_query_kind_by_operation: {connect: usage}
      # Reverse adoption needs one additional hop to reach the owning team:
      # definition -> deployment -> usage -> person -> team.
      graph_depth_by_subject_kind: {person: 2, agent_definition: 4, agent_deployment: 3, system: 3, usage_record: 2, outcome: 2}
    semantic_operation_contracts:
      understand:
        description: Explain the meaning, facts, or procedure of the selected subjects without traversing a relationship graph.
        presentations: [prose, table]
        graph_query_kinds: []
      compare:
        description: Contrast two or more selected subjects and make their similarities and differences explicit.
        presentations: [prose, table]
        graph_query_kinds: [compare]
      connect:
        description: Traverse, sequence, or visualize verified relationships between selected subjects.
        presentations: [prose, table, timeline, mermaid, explorer]
        graph_query_kinds: [neighbors, path, workflow, impact, lineage, responsibility, timeline, tour, usage]
        requires_graph: true
      validate:
        description: Check a claim or result against its supporting evidence and provenance.
        presentations: [prose, table, timeline, mermaid, explorer]
        graph_query_kinds: [lineage]
      observe:
        description: Report current operational state without changing it or inferring a relationship traversal.
        presentations: [prose, table, timeline]
        graph_query_kinds: []
    default_operation: understand
    operation_pipeline: [understand]
    presentations: [prose, table, timeline, mermaid, explorer]
    presentation_aliases: {answer: prose}
    graph_query_kinds: [neighbors, path, workflow, impact, lineage, responsibility, timeline, compare, tour, usage]
    work_views: [none, responsibility, combined]
    work_view_operation_contracts:
      responsibility: [understand, compare, connect, validate, observe]
      combined: [understand, compare, connect, validate, observe]
    evidence_scopes: [canonical, operational, validation]
    default_evidence_scope: canonical
    topic_identity_sources: [grounded_claims, artifact, resolved_entities]
    harness_ids: [context.work]
    subject_policy: optional
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {required: [query]}
    output_schema: {type: search_results}
    context_recipe: [page, selected_text, ontology, authoritative_knowledge]
    evidence_policy: [acl_visible, published_or_reviewed, cite_sources]
    completion_criteria: [one_or_more_relevant_evidence_or_explicit_no_result]
    allowed_loop_kinds: [turn, time, proactive]
    allowed_loop_triggers: [user, api, event, schedule, interval]
    default_loop_contract:
      <<: *bounded_turn
      exit_criteria_refs: [one_or_more_relevant_evidence_or_explicit_no_result]
    handler: grounded_read
    handler_config:
      retrieval_provider: hybrid
      unbound_fallback: evidence_table
      empty_summary: 확인된 근거가 없습니다.
      answer_input_tokens: 5000
      max_answer_sources: 4
      # Broad recall remains available in the retrieval manifest and graph
      # artifact, while synchronous WorkContext/citation compilation handles a
      # bounded whole-item set. Exact page, selection, topic, and pinned refs
      # are protected by the common Catalog boundary in AgentV2Service.
      max_context_sources: 8
      max_presentation_sources: 6
      max_display_items: 5
      max_relation_items: 12
    renderer: search
    permissions: [boi.viewer]
    readiness: [content]
    offer_surfaces: [library, document, sop, event, action, agent]
    starter_offers:
      - offer_id: knowledge.current-responsibility
        category: current_work
        area: current_work
        selector: current_work
        subject_binding: principal_person
        current_work_condition: present
        label_template: 내 역할과 지금 맡은 일을 한눈에 보기
        prompt_template: 내 공식 역할과 검증된 업무 관계를 현재 Inbox 업무와 구분해서 보여줘. 지금은 '{subject_title}'을 포함해 먼저 확인할 일을 표로 정리해줘.
        reason_template: 현재 처리할 업무가 있습니다.
        priority: 10
        context_basis: current_work
        result_kind: table
        graph_query_kind: responsibility
        semantic_operation: connect
        fallback_to_answer: true
        work_view: combined
      - offer_id: knowledge.page-relations
        category: knowledge_relation
        area: knowledge
        selector: page_anchor
        label_template: "{subject_title}의 핵심과 연결 관계 보기"
        prompt_template: 현재 보고 있는 {subject_title}의 핵심을 설명하고, Wiki 전체에서 실제로 연결된 내용만 근거와 함께 보여줘.
        reason_template: 현재 화면을 출발점으로 Wiki 전체의 관계를 살펴봅니다.
        priority: 20
        context_basis: page_anchor
        result_kind: explorer
        graph_query_kind: neighbors
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.page-relation-table
        category: knowledge_relation
        area: knowledge
        selector: page_anchor
        only_when_category_empty: false
        label_template: "{subject_title}의 핵심 항목을 표로 보기"
        prompt_template: 현재 보고 있는 {subject_title}과 직접 연결된 항목을 관계와 확인 상태가 드러나는 표로 보여줘.
        reason_template: 현재 화면과 직접 연결된 검토 항목을 비교하기 쉽게 봅니다.
        priority: 21
        context_basis: page_anchor
        result_kind: table
        graph_query_kind: neighbors
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.connected-workflow
        category: sop_task
        area: workflow
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [sop, workflow]
        include_anchor_source: true
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'과 '{subject_title}'이 실제로 어떻게 연결되는지, 업무 흐름과 근거를 쉽게 설명해줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 업무 흐름입니다.
        priority: 50
        context_basis: ontology_neighbor
        result_kind: mermaid
        graph_query_kind: workflow
        semantic_operation: connect
      - offer_id: knowledge.connected-event
        category: business_event
        area: event_action
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [event]
        include_anchor_source: true
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'과 업무 이벤트 '{subject_title}'의 실제 연결 관계와 발생 조건, 이어지는 결과를 근거와 함께 보여줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 업무 이벤트입니다.
        priority: 60
        context_basis: ontology_neighbor
        result_kind: explorer
        graph_query_kind: impact
        semantic_operation: connect
      - offer_id: knowledge.connected-action
        category: action
        area: event_action
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [action]
        include_anchor_source: true
        only_when_category_empty: false
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'에서 Action '{subject_title}'을 어디에 사용하는지, 입력과 결과 및 실행 전 확인할 근거를 설명해줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 Action입니다.
        priority: 65
        context_basis: ontology_neighbor
        result_kind: explorer
        graph_query_kind: impact
        semantic_operation: connect
      - offer_id: knowledge.entrypoint-knowledge
        category: knowledge_relation
        area: knowledge
        selector: canonical_entrypoint
        entrypoint_area: knowledge
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}부터 BoI Wiki 살펴보기"
        prompt_template: 검토된 지식 {subject_title}의 핵심과 실제로 연결된 내용을 Wiki 전체 근거로 설명해줘.
        reason_template: 검토된 공용 지식에서 시작합니다.
        priority: 91
        context_basis: canonical_entrypoint
        result_kind: explorer
        graph_query_kind: neighbors
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-workflow
        category: sop_task
        area: workflow
        selector: canonical_entrypoint
        entrypoint_area: workflow
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 업무 흐름 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 흐름과 Task를 설계하는 방법을 근거와 함께 설명해줘.
        reason_template: 검토된 업무 흐름 지식에서 살펴봅니다.
        priority: 92
        context_basis: canonical_entrypoint
        result_kind: mermaid
        graph_query_kind: workflow
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-event-action
        category: business_event
        area: event_action
        selector: canonical_entrypoint
        entrypoint_area: event_action
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 업무 발생과 실행 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 이벤트와 Action의 연결을 근거와 함께 설명해줘.
        reason_template: 검토된 업무 이벤트 지식에서 살펴봅니다.
        priority: 93
        context_basis: canonical_entrypoint
        result_kind: explorer
        graph_query_kind: impact
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-learning
        category: knowledge_capture
        area: learning
        selector: canonical_entrypoint
        entrypoint_area: learning
        only_when_category_empty: false
        only_when_area_empty: false
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 지식 재사용 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 결과가 다음 업무에 재사용되는 과정을 설명해줘.
        reason_template: 검토된 학습 순환 지식에서 살펴봅니다.
        priority: 94
        context_basis: canonical_entrypoint
        result_kind: timeline
        graph_query_kind: timeline
        semantic_operation: connect
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-automation
        category: automatic_check
        area: automation
        selector: canonical_entrypoint
        entrypoint_area: automation
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 자동 확인 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 자동 확인 계획과 사람 확인 절차를 설명해줘.
        reason_template: 검토된 자동 확인 지식에서 살펴봅니다.
        priority: 95
        context_basis: canonical_entrypoint
        result_kind: answer

  - capability_id: work.inbox
    title: 내 업무 보기
    description: 현재 처리해야 할 Inbox와 Task만 보여줍니다.
    primary_asset: runtime
    supported_assets: [runtime]
    subject_kinds: [runtime, person, team]
    examples: [내 할 일, 처리할 업무, inbox, 승인 대기, 담당 업무]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, observe, connect]
    semantic_compile:
      priority: 80
      preferred_subject_kinds: [runtime, person, team]
      evidence_modes: [current_work, execution_evidence]
      work_perspectives: [current]
      work_perspective_subject_kinds: [person, task, runtime, action, work_record]
      work_perspective_subject_kinds_by_perspective:
        current: [person, task, runtime, action, work_record]
      mutation_intents: [none]
      loop_intents: [turn]
      default_graph_query_by_operation: {connect: lineage}
    default_operation: observe
    operation_pipeline: [observe]
    operation_pipelines:
      understand: [understand]
      observe: [observe]
      connect: [understand, connect]
    presentations: [prose, table, timeline]
    presentation_aliases: {answer: prose}
    graph_query_kinds: [lineage]
    work_views: [current]
    default_work_view: current
    default_evidence_scope: operational
    topic_identity_sources: [grounded_claims, artifact, resolved_entities]
    harness_ids: [context.work]
    subject_policy: optional
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {}
    output_schema: {type: task_cards}
    context_recipe: [current_identity, active_runtime]
    evidence_policy: [exclude_history_seed, acl_visible]
    completion_criteria: [current_work_count_reported]
    allowed_loop_kinds: [turn]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
