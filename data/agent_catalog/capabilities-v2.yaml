version: "2.0"
loop_contract_templates:
  bounded_turn: &bounded_turn
    kind: turn
    trigger: user
    task_stop: agent_done
    routine_stop: one_shot
    max_iterations: 1
    max_no_progress: 2
    max_tool_loops: 1
    max_model_calls: 4
    max_elapsed_seconds: 180
    max_context_tokens: 0
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
  bounded_goal: &bounded_goal
    kind: goal
    trigger: user
    task_stop: exit_criteria
    routine_stop: one_shot
    max_iterations: 5
    max_no_progress: 2
    max_tool_loops: 5
    max_model_calls: 8
    max_elapsed_seconds: 900
    max_context_tokens: 0
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
  deep_goal: &deep_goal
    kind: goal
    trigger: user
    task_stop: exit_criteria
    routine_stop: one_shot
    max_iterations: 5
    max_no_progress: 2
    max_tool_loops: 5
    max_model_calls: 12
    max_elapsed_seconds: 3600
    max_context_tokens: 0
    max_runs: 1
    exit_criteria_refs: []
    progress_policy: structured_delta
    verifier_policy: harness
asset_defaults:
  knowledge: knowledge.search
  sop: sop.plan
  workflow: workflow.transform
  task: task.work
  business_event: business_event.plan
  action: action.plan
  skill: skill.plan
  runtime: work.inbox
  evidence: cases.similar
legacy_import:
  capability_aliases:
    search: knowledge.search
    summarize: knowledge.search
    validate: cases.similar
    diagram: sop.plan
    draft: knowledge.draft
    request_action: action.plan
    sop: sop.plan
    event: business_event.plan
  source_scope_aliases:
    boi_docs: boi
    sops: sop
    events_actions: event
    similar_cases: history
  required_capabilities: [knowledge.search]
helper_templates:
  - template_id: search
    name: 자료 찾기 도우미
    instructions: 질문과 관련된 검토된 BoI 자료를 먼저 찾고, 근거 링크와 함께 간결하게 답합니다.
    capability_ids: [knowledge.search, cases.similar]
  - template_id: sop
    name: SOP 설계 도우미
    instructions: 업무 목표를 Task로 나누고 각 Task의 목적, 종료 기준, 필요한 근거를 구체화합니다.
    capability_ids: [knowledge.search, sop.plan, action.plan, business_event.plan]
  - template_id: evidence
    name: 근거 검증 도우미
    instructions: 주장의 근거를 BoI Wiki와 유사 사례에서 확인하고, 부족한 근거와 다음 확인 항목을 구분합니다.
    capability_ids: [knowledge.search, cases.similar, knowledge.draft]
  - template_id: blank
    name: 새 BoI Agent
    instructions: ""
    capability_ids: [knowledge.search]
capabilities:
  - capability_id: knowledge.search
    title: 업무 지식 찾기
    description: 빠른 질문, 현재 문서 설명, 관계 확인에 필요한 BoI 문서·SOP·Event·Action·Skill을 함께 찾습니다.
    primary_asset: knowledge
    supported_assets: [knowledge, sop, workflow, task, business_event, action, skill, runtime, evidence]
    subject_kinds: [knowledge, concept, document, sop, workflow, task, business_event, event, action, skill, runtime, runtime_catalog, evidence, person, team, role, data_artifact, work_record, completion_record, knowledge_candidate]
    examples: [찾아줘, 검색, 관련 문서, 무엇인지 알려줘, 업무 지식]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, compare, connect, validate, observe]
    default_operation: understand
    operation_pipeline: [understand]
    presentations: [prose, table, timeline, mermaid, explorer]
    presentation_aliases: {answer: prose}
    graph_query_kinds: [neighbors, path, workflow, impact, lineage, responsibility, timeline, compare, tour]
    work_views: [none, responsibility, combined]
    evidence_scopes: [canonical, operational, validation]
    default_evidence_scope: canonical
    harness_ids: [context.work]
    subject_policy: optional
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {required: [query]}
    output_schema: {type: search_results}
    context_recipe: [page, selected_text, ontology, authoritative_knowledge]
    evidence_policy: [acl_visible, published_or_reviewed, cite_sources]
    completion_criteria: [one_or_more_relevant_evidence_or_explicit_no_result]
    allowed_loop_kinds: [turn, time, proactive]
    allowed_loop_triggers: [user, api, event, schedule, interval]
    default_loop_contract:
      <<: *bounded_turn
      exit_criteria_refs: [one_or_more_relevant_evidence_or_explicit_no_result]
    handler: grounded_read
    handler_config:
      retrieval_provider: hybrid
      empty_summary: 확인된 근거가 없습니다.
    renderer: search
    permissions: [boi.viewer]
    readiness: [content]
    offer_surfaces: [library, document, sop, event, action, agent]
    starter_offers:
      - offer_id: knowledge.current-responsibility
        category: current_work
        area: current_work
        selector: current_work
        subject_binding: principal_person
        current_work_condition: present
        label_template: 내 역할과 지금 맡은 일을 한눈에 보기
        prompt_template: 내 공식 역할과 검증된 업무 관계를 현재 Inbox 업무와 구분해서 보여줘. 지금은 '{subject_title}'을 포함해 먼저 확인할 일을 표로 정리해줘.
        reason_template: 현재 처리할 업무가 있습니다.
        priority: 10
        context_basis: current_work
        result_kind: table
        graph_query_kind: responsibility
        fallback_to_answer: true
        work_view: combined
      - offer_id: knowledge.page-relations
        category: knowledge_relation
        area: knowledge
        selector: page_anchor
        label_template: "{subject_title}의 핵심과 연결 관계 보기"
        prompt_template: 현재 보고 있는 {subject_title}의 핵심을 설명하고, Wiki 전체에서 실제로 연결된 내용만 근거와 함께 보여줘.
        reason_template: 현재 화면을 출발점으로 Wiki 전체의 관계를 살펴봅니다.
        priority: 20
        context_basis: page_anchor
        result_kind: explorer
        graph_query_kind: neighbors
        fallback_to_answer: true
      - offer_id: knowledge.page-relation-table
        category: knowledge_relation
        area: knowledge
        selector: page_anchor
        only_when_category_empty: false
        label_template: "{subject_title}의 핵심 항목을 표로 보기"
        prompt_template: 현재 보고 있는 {subject_title}과 직접 연결된 항목을 관계와 확인 상태가 드러나는 표로 보여줘.
        reason_template: 현재 화면과 직접 연결된 검토 항목을 비교하기 쉽게 봅니다.
        priority: 21
        context_basis: page_anchor
        result_kind: table
        graph_query_kind: neighbors
        fallback_to_answer: true
      - offer_id: knowledge.connected-workflow
        category: sop_task
        area: workflow
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [sop, workflow]
        include_anchor_source: true
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'과 '{subject_title}'이 실제로 어떻게 연결되는지, 업무 흐름과 근거를 쉽게 설명해줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 업무 흐름입니다.
        priority: 50
        context_basis: ontology_neighbor
        result_kind: mermaid
        graph_query_kind: workflow
      - offer_id: knowledge.connected-event
        category: business_event
        area: event_action
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [event]
        include_anchor_source: true
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'과 업무 이벤트 '{subject_title}'의 실제 연결 관계와 발생 조건, 이어지는 결과를 근거와 함께 보여줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 업무 이벤트입니다.
        priority: 60
        context_basis: ontology_neighbor
        result_kind: explorer
        graph_query_kind: impact
      - offer_id: knowledge.connected-action
        category: action
        area: event_action
        selector: connected_record
        anchor_entrypoint_area: knowledge
        record_kinds: [action]
        include_anchor_source: true
        only_when_category_empty: false
        label_template: "{anchor_title}와 연결된 '{subject_title}' 보기"
        prompt_template: "'{anchor_title}'에서 Action '{subject_title}'을 어디에 사용하는지, 입력과 결과 및 실행 전 확인할 근거를 설명해줘."
        reason_template: 현재 맥락과 직접 연결된 검토된 Action입니다.
        priority: 65
        context_basis: ontology_neighbor
        result_kind: explorer
        graph_query_kind: impact
      - offer_id: knowledge.entrypoint-knowledge
        category: knowledge_relation
        area: knowledge
        selector: canonical_entrypoint
        entrypoint_area: knowledge
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}부터 BoI Wiki 살펴보기"
        prompt_template: 검토된 지식 {subject_title}의 핵심과 실제로 연결된 내용을 Wiki 전체 근거로 설명해줘.
        reason_template: 검토된 공용 지식에서 시작합니다.
        priority: 91
        context_basis: canonical_entrypoint
        result_kind: explorer
        graph_query_kind: neighbors
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-workflow
        category: sop_task
        area: workflow
        selector: canonical_entrypoint
        entrypoint_area: workflow
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 업무 흐름 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 흐름과 Task를 설계하는 방법을 근거와 함께 설명해줘.
        reason_template: 검토된 업무 흐름 지식에서 살펴봅니다.
        priority: 92
        context_basis: canonical_entrypoint
        result_kind: mermaid
        graph_query_kind: workflow
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-event-action
        category: business_event
        area: event_action
        selector: canonical_entrypoint
        entrypoint_area: event_action
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 업무 발생과 실행 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 이벤트와 Action의 연결을 근거와 함께 설명해줘.
        reason_template: 검토된 업무 이벤트 지식에서 살펴봅니다.
        priority: 93
        context_basis: canonical_entrypoint
        result_kind: explorer
        graph_query_kind: impact
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-learning
        category: knowledge_capture
        area: learning
        selector: canonical_entrypoint
        entrypoint_area: learning
        only_when_category_empty: false
        only_when_area_empty: false
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 지식 재사용 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 업무 결과가 다음 업무에 재사용되는 과정을 설명해줘.
        reason_template: 검토된 학습 순환 지식에서 살펴봅니다.
        priority: 94
        context_basis: canonical_entrypoint
        result_kind: timeline
        graph_query_kind: timeline
        fallback_to_answer: true
      - offer_id: knowledge.entrypoint-automation
        category: automatic_check
        area: automation
        selector: canonical_entrypoint
        entrypoint_area: automation
        only_when_area_empty: true
        use_entrypoint_copy: true
        label_template: "{subject_title}에서 자동 확인 살펴보기"
        prompt_template: 검토된 지식 '{subject_title}'을 바탕으로 자동 확인 계획과 사람 확인 절차를 설명해줘.
        reason_template: 검토된 자동 확인 지식에서 살펴봅니다.
        priority: 95
        context_basis: canonical_entrypoint
        result_kind: answer

  - capability_id: work.inbox
    title: 내 업무 보기
    description: 현재 처리해야 할 Inbox와 Task만 보여줍니다.
    primary_asset: runtime
    supported_assets: [runtime]
    subject_kinds: [runtime, person, team]
    examples: [내 할 일, 처리할 업무, inbox, 승인 대기, 담당 업무]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, observe]
    default_operation: observe
    operation_pipeline: [observe]
    presentations: [prose, table, timeline]
    presentation_aliases: {answer: prose}
    work_views: [current]
    default_work_view: current
    default_evidence_scope: operational
    harness_ids: [context.work]
    subject_policy: optional
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {}
    output_schema: {type: task_cards}
    context_recipe: [current_identity, active_runtime]
    evidence_policy: [exclude_history_seed, acl_visible]
    completion_criteria: [current_work_count_reported]
    allowed_loop_kinds: [turn]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
      <<: *bounded_turn
      exit_criteria_refs: [current_work_count_reported]
    handler: current_work
    handler_config:
      retrieval_provider: current_work
      default_goal: 현재 내가 처리할 업무를 보여줘
    renderer: task_cards
    permissions: [boi.viewer]
    readiness: [content]
    offer_surfaces: [library, inbox]

  - capability_id: task.work
    title: Task 진행하기
    description: 지정한 Task의 업무 맥락, 완료된 모습과 확인할 자료를 바탕으로 사람과 AI가 같은 WorkRun에서 수행·확인·완료 기록을 이어갑니다. Inbox 목록 조회나 등록된 Action의 직접 호출에는 사용하지 않습니다.
    primary_asset: task
    supported_assets: [task, runtime, evidence, knowledge]
    subject_kinds: [task]
    examples: [이 Task 진행, Task 완료, 근거 확인, 결과 기록, 업무 이어서]
    operation: read
    user_effects: [read, execute]
    default_user_effect: read
    semantic_operations: [understand, observe, run, complete]
    default_operation: understand
    operation_pipeline: [understand]
    operation_pipelines:
      understand: [understand]
      observe: [understand, observe]
      run: [understand, validate, run, observe]
      complete: [understand, validate, complete, capture]
    presentations: [prose, table, timeline, artifact]
    presentation_aliases: {answer: prose, work_form: artifact}
    default_evidence_scope: operational
    harness_ids: [context.work, task.runtime]
    subject_policy: target_required
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {required: [query]}
    output_schema: {type: task_progress}
    context_recipe: [task, workflow, completion_design, evidence, active_work_run]
    evidence_policy: [acl_visible, task_completion_contract, human_or_system_confirmation]
    completion_criteria: [work_run_state_reported, completion_never_self_declared]
    allowed_loop_kinds: [goal]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
      <<: *bounded_goal
      exit_criteria_refs: [task_exit_criteria, evidence_ledger_verified]
    handler: task_runtime
    handler_config:
      retrieval_provider: hybrid
    renderer: task_progress
    permissions: [boi.viewer]
    readiness: [content, model]

  - capability_id: workflow.transform
    title: 흐름을 Task 후보로 나누기
    description: 선택한 근거 기반 흐름 그림을 실행 가능한 private Task 후보로 변환합니다.
    primary_asset: workflow
    supported_assets: [workflow, task, evidence]
    subject_kinds: [artifact, workflow]
    examples: [이 흐름을 Task로 나눠줘, 선택한 흐름을 실행 단계로 바꿔줘]
    operation: draft
    user_effects: [transform]
    default_user_effect: transform
    semantic_operations: [refine]
    default_operation: refine
    operation_pipeline: [understand, refine, validate]
    presentations: [artifact]
    presentation_aliases: {answer: artifact, work_form: artifact}
    default_presentation: artifact
    harness_ids: [context.work]
    subject_policy: target_required
    risk: low
    task_modes: [copilot, autopilot]
    input_schema: {required: [goal]}
    output_schema: {type: workflow_draft}
    context_recipe: [active_artifact, source_refs]
    evidence_policy: [acl_visible, grounded_source_artifact, private_draft]
    completion_criteria: [workflow_tasks_present, production_unchanged]
    allowed_loop_kinds: [goal]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
      <<: *bounded_goal
      exit_criteria_refs: [workflow_tasks_present, production_unchanged]
    handler: artifact_transform
    handler_config:
      domain_operation: mermaid.workflow_draft.create
      accepted_artifact_types: [mermaid_diagram, ontology_graph]
      output_artifact_type: workflow_draft
      title_suffix: Task 후보
      note: BoI Agent에서 사용자가 명시적으로 흐름의 Task 분해를 요청함
    renderer: draft
    permissions: [boi.editor]
    readiness: [content]
    offer_surfaces: [document, agent]

  - capability_id: cases.similar
    title: 유사 사례 찾기
    description: 현재 업무 맥락과 종료 기준이 비슷한 과거 사례를 찾아 근거와 결과를 집중 비교합니다.
    primary_asset: evidence
    supported_assets: [evidence, task, runtime]
    examples: [유사 사례, 비슷한 경우, 과거 처리, 이전 사례]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, compare, connect]
    default_operation: compare
    operation_pipeline: [understand, compare]
    presentations: [prose, table, timeline, mermaid, explorer]
    presentation_aliases: {answer: prose}
    graph_query_kinds: [neighbors, path, lineage, timeline, compare]
    harness_ids: [context.work]
    subject_policy: required
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {required: [query]}
    output_schema: {type: case_results}
    context_recipe: [task, exit_criteria, evidence_types, history_seed]
    evidence_policy: [acl_visible, outcome_present]
    completion_criteria: [similarity_reason_reported]
    allowed_loop_kinds: [turn]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
      <<: *bounded_turn
      exit_criteria_refs: [similarity_reason_reported]
    handler: grounded_read
    handler_config:
      retrieval_provider: hybrid
      include_history: true
      kinds: [case]
      empty_summary: 확인된 유사 사례가 없습니다.
    renderer: cases
    permissions: [boi.viewer]
    readiness: [content]
    offer_surfaces: [library, document, inbox, event, action]
    starter_offers:
      - offer_id: cases.current-similar
        category: similar_case
        area: knowledge
        selector: current_work
        current_work_condition: present
        label_template: "'{subject_title}'와 비슷한 사례 보기"
        prompt_template: "'{subject_title}'와 업무 맥락과 결과가 비슷한 과거 사례를 근거와 함께 비교해줘."
        reason_template: 현재 업무에 참고할 과거 결과를 찾습니다.
        priority: 30
        context_basis: current_work
        result_kind: table
        graph_query_kind: compare
        fallback_to_answer: true
      - offer_id: cases.page-similar
        category: similar_case
        area: knowledge
        selector: page_anchor
        current_work_condition: absent
        label_template: "{subject_title}와 닮은 사례 보기"
        prompt_template: "{subject_title}와 관련된 실제 처리 사례와 결과를 찾아 차이점을 비교해줘."
        reason_template: 현재 화면과 관련된 과거 처리 결과를 찾습니다.
        priority: 35
        context_basis: page_anchor
        result_kind: table
        graph_query_kind: compare
        fallback_to_answer: true

  - capability_id: business_event.plan
    title: 업무 이벤트 초안 만들기
    description: 어떤 순간을 업무 발생으로 볼지 정의하는 초안을 만듭니다.
    primary_asset: business_event
    supported_assets: [business_event]
    examples: [업무 이벤트, 알람 조건, 상태 변경, 반복 신호, event definition]
    operation: draft
