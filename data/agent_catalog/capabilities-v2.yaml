  - capability_id: cases.similar
    title: 유사 사례 찾기
    description: 현재 업무 맥락과 종료 기준이 비슷한 과거 사례를 찾아 근거와 결과를 집중 비교합니다.
    primary_asset: evidence
    # Reviewed case projections are reusable knowledge records while their
    # typed comparison result remains evidence. Declaring both prevents a
    # broad knowledge result intent from hiding the stronger historical-case
    # evidence contract during deterministic Catalog compilation.
    supported_assets: [knowledge, evidence, task, runtime]
    # The subject is the business anchor used to find cases, while the output
    # remains evidence/runtime. Follow-up selections are persisted as
    # knowledge refs, so both concept and knowledge are first-class anchors.
    subject_kinds: [knowledge, concept, dictionary, document, sop, workflow, task, business_event, event, action, skill, runtime, runtime_catalog, evidence, person, team, role, data_artifact, work_record, completion_record, knowledge_candidate, case]
    examples: [유사 사례, 비슷한 경우, 과거 처리, 이전 사례]
    operation: read
    user_effects: [read]
    default_user_effect: read
    semantic_operations: [understand, compare, connect]
    semantic_compile:
      priority: 100
      preferred_subject_kinds: [case, evidence, task, runtime, work_record, business_event, event, action]
      evidence_modes: [historical_cases]
      continuation_evidence_modes: [historical_cases, execution_evidence]
      continuation_evidence_mode_aliases_by_operation:
        understand:
          authoritative_knowledge: historical_cases
      continuation_operation_aliases: {validate: understand}
      evidence_scopes_by_mode:
        historical_cases: [canonical, operational, validation]
      evidence_authorities_by_mode:
        # Reviewed case projections are published knowledge records whose
        # review state lives in status, while raw Event/Action history keeps
        # historical/runtime authority.  Both forms are legitimate case
        # evidence and remain subject to ACL and outcome checks.
        historical_cases: [published, historical, reviewed, runtime, verified, provisional]
      evidence_statuses_by_mode:
        # Similar-case evidence must represent an outcome, not merely an
        # observed Event, pending Action, or private draft.  This typed policy
        # is enforced before ranking for every Web/API/MCP client.
        historical_cases: [completed, succeeded, success, resolved, closed, final, reviewed, published, approved, verified, provisional]
      # Similarity compares every verified case the principal may read.
      # Provenance and ACL still filter the records; a planner cannot
      # accidentally narrow the set to org-only and discard personal/runtime
      # completion evidence before deterministic ranking.
      evidence_authority_scope_by_mode:
        historical_cases: any
      mutation_intents: [none]
      loop_intents: [turn]
      default_graph_query_by_operation: {connect: lineage}
      default_graph_query_by_presentation: {timeline: timeline}
    semantic_operation_contracts:
      understand:
        description: Explain one selected case and its verified judgment evidence without searching for another comparison set.
        presentations: [prose, table]
        graph_query_kinds: []
      compare:
        description: Find and contrast two or more relevant cases; do not use this operation for a drill-down into one selected case.
        presentations: [prose, table]
        graph_query_kinds: []
      connect:
        description: Traverse the evidence lineage, path, or time sequence that connects cases and their outcomes.
        presentations: [prose, table, timeline, mermaid, explorer]
        graph_query_kinds: [neighbors, path, lineage, timeline]
        requires_graph: true
    default_operation: compare
    operation_pipeline: [understand, compare]
    presentations: [prose, table, timeline, mermaid, explorer]
    presentation_aliases: {answer: prose}
    graph_query_kinds: [neighbors, path, lineage, timeline]
    evidence_scopes: [canonical, operational, validation]
    topic_identity_sources: [grounded_claims, artifact, resolved_entities]
    # The first resolved identity is the business anchor. Additional resolved
    # identities are case results, and ordinal follow-ups address that result
    # list even when only one case was returned.
    topic_primary_subject_count: 1
    followup_ordinal_scope: results
    harness_ids: [context.work]
    subject_policy: required
    risk: low
    task_modes: [manual, copilot, autopilot]
    input_schema: {required: [query]}
    output_schema:
      type: case_results
      grounded_output_contract: case_comparison.v1
      required_claim_kinds: [case_difference, case_applicability, application_limit]
    context_recipe: [task, exit_criteria, evidence_types, history_seed]
    evidence_policy: [acl_visible, outcome_present]
    completion_criteria: [similarity_reason_reported]
    allowed_loop_kinds: [turn]
    allowed_loop_triggers: [user, api]
    default_loop_contract:
      <<: *bounded_turn
      exit_criteria_refs: [similarity_reason_reported]
    handler: grounded_read
    handler_config:
      retrieval_provider: hybrid
      # Output semantics are compiled after retrieval from exact ACL/policy-
      # checked citation bindings. The compiler is selected by this typed
      # operation contract, never by request wording or a scenario identifier.
      grounded_output_contracts:
        compare: case_comparison.v1
      # If semantic ranking is unavailable or the request wording has no
      # deterministic overlap, return a bounded, ACL-filtered set of verified
      # outcome candidates and expose degraded relevance. This is a catalog
      # policy, not a question-keyword route.
      retrieval_policy:
        eligible_outcome_fallback_enabled: 1.0
        eligible_outcome_fallback_min_items: 2
        eligible_outcome_fallback_limit: 4
      include_history: true
      include_history_by_operation:
        understand: false
        compare: true
        connect: true
      require_outcome_by_operation:
        understand: false
        compare: true
        connect: true
      kinds: [case, knowledge_candidate, completion_record, work_record]
      unbound_fallback: evidence_table
      answer_input_tokens: 5000
      max_answer_sources: 4
      # Keep broad ACL/policy-filtered recall in the retrieval manifest, but
      # compile only this ranked set into WorkContext, citations, and answer.
      max_context_sources: 8
      max_presentation_sources: 4
      empty_summary: 확인된 유사 사례가 없습니다.
    renderer: cases
    permissions: [boi.viewer]
    readiness: [content]
    offer_surfaces: [library, document, inbox, event, action]
    starter_offers:
      - offer_id: cases.current-similar
        category: similar_case
        area: knowledge
        selector: current_work
        current_work_condition: present
        label_template: "'{subject_title}'와 비슷한 사례 보기"
        prompt_template: "'{subject_title}'와 업무 맥락과 결과가 비슷한 과거 사례를 근거와 함께 비교해줘."
        reason_template: 현재 업무에 참고할 과거 결과를 찾습니다.
        priority: 30
        context_basis: current_work
        result_kind: table
        fallback_to_answer: true
      - offer_id: cases.page-similar
        category: similar_case
        area: knowledge
        selector: page_anchor
        current_work_condition: absent
        label_template: "{subject_title}와 닮은 사례 보기"
        prompt_template: "{subject_title}와 관련된 실제 처리 사례와 결과를 찾아 차이점을 비교해줘."
        reason_template: 현재 화면과 관련된 과거 처리 결과를 찾습니다.
        priority: 35
        context_basis: page_anchor
        result_kind: table
        fallback_to_answer: true

