<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ share.title }} · BoI Wiki</title>
  <link rel="stylesheet" href="{{ asset_url('style.css') }}" />
  <style>
    html, body { height:100%; }
    body.share-viewer-body { display:flex; flex-direction:column; margin:0; }
    .share-viewer-header { display:flex; align-items:center; gap:14px; padding:10px 18px; border-bottom:1px solid #e2e8f0; background:#fff; flex-wrap:wrap; }
    .share-viewer-header .app-brand { font-weight:900; text-decoration:none; color:#111827; }
    .share-viewer-meta { display:flex; flex-direction:column; gap:2px; min-width:0; flex:1; }
    .share-viewer-meta strong { font-size:15px; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .share-viewer-meta .muted { font-size:12px; }
    .share-viewer-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .share-viewer-actions a { text-decoration:none; }
    .share-viewer-frame { flex:1; width:100%; border:0; background:#fff; }
  </style>
</head>
<body class="share-viewer-body">
  <header class="share-viewer-header">
    <a class="app-brand" href="{{ home_url }}">BoI Wiki</a>
    <div class="share-viewer-meta">
      <strong>{{ share.title }}</strong>
      <span class="muted">{{ owner_label }} · 갱신 {{ share.updated_at }} · 조회 {{ views }}회</span>
    </div>
    <div class="share-viewer-actions">
      <span class="badge {{ share.visibility }}">{{ share.visibility }}</span>
      <button type="button" class="inline-button" id="share-copy-button" data-share-path="{{ share.url }}">주소 복사</button>
      <button type="button" class="inline-button" data-feedback-value="helpful">도움됨</button>
      <button type="button" class="inline-button" data-feedback-value="needs_fix">수정 필요</button>
      <span class="muted" id="share-feedback-status" aria-live="polite"></span>
      <a class="inline-button" href="{{ raw_url }}" target="_blank" rel="noopener">원본 크게 보기</a>
      <a class="inline-button" href="{{ share_page_url }}">공유 관리</a>
    </div>
  </header>
  <iframe class="share-viewer-frame" sandbox="allow-scripts" src="{{ raw_url }}" title="{{ share.title }}"></iframe>
  <script>
    (function () {
      // 피드백 루프: 도움됨/수정 필요 — DOM 갱신은 textContent만 사용한다.
      var feedbackUrl = {{ feedback_api_url | tojson }};
      var status = document.getElementById("share-feedback-status");
      Array.prototype.forEach.call(document.querySelectorAll("[data-feedback-value]"), function (button) {
        button.addEventListener("click", function () {
          var helpful = button.getAttribute("data-feedback-value") === "helpful";
          fetch(feedbackUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ helpful: helpful }),
          })
            .then(function (resp) {
              status.textContent = resp.ok ? "피드백이 저장되었습니다" : "피드백 저장에 실패했습니다";
            })
            .catch(function () {
              status.textContent = "피드백 저장에 실패했습니다";
            });
        });
      });
      var button = document.getElementById("share-copy-button");
      button.addEventListener("click", function () {
        var url = location.origin + button.getAttribute("data-share-path");
        var done = function () {
          var original = button.textContent;
          button.textContent = "복사됨";
          window.setTimeout(function () { button.textContent = original; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done).catch(function () { window.prompt("단축주소를 복사하세요:", url); });
        } else {
          window.prompt("단축주소를 복사하세요:", url);
        }
      });
    })();
  </script>
</body>
</html>
