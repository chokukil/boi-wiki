<style>
.knowledge-portal{max-width:1160px;margin:0 auto;padding:24px;line-height:1.65;color:#172b35;overflow-wrap:anywhere}
.knowledge-portal a{color:#126260}.knowledge-portal h1{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.04em;margin:0 0 8px}.knowledge-portal h2{font-size:1.2rem;margin:0 0 10px}
.knowledge-portal p{margin:6px 0 16px}.knowledge-intro{padding:22px 0}.knowledge-eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:#466c6a}
.knowledge-navigation,.knowledge-tabs{display:flex;flex-wrap:wrap;gap:10px 20px}.knowledge-navigation{font-size:.9rem;margin:12px 0 24px}.knowledge-tabs{border-bottom:1px solid #cbd8d8;margin:18px 0 24px;gap:24px}
.knowledge-tabs a{padding:10px 0;text-decoration:none}.knowledge-tabs a[aria-current]{font-weight:700;border-bottom:3px solid #247b72;color:#163f3b}
.knowledge-filter{display:flex;align-items:end;gap:10px;margin-bottom:24px}.knowledge-filter label{flex:1}.knowledge-filter input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #b8c9cb;border-radius:6px;background:#fff}.knowledge-filter button{padding:11px 18px;border:0;border-radius:6px;background:#215f58;color:white;font:inherit;cursor:pointer}
.knowledge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.knowledge-card{border:1px solid #d6e0df;border-radius:10px;padding:20px;background:white;min-width:0}.knowledge-card:only-child{grid-column:1/-1}.knowledge-card h2 a{text-decoration:none}.knowledge-card h2 a:hover{text-decoration:underline}
.knowledge-card-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:.8rem;color:#496268}.knowledge-badge{border-radius:4px;padding:2px 7px;background:#eff5f3}.knowledge-status{font-size:.88rem;color:#496268}.knowledge-card details{margin-top:12px}.knowledge-card code{font-size:.78rem;word-break:break-all}.knowledge-card ul{padding-left:20px}
.knowledge-coverage{display:flex;flex-wrap:wrap;gap:12px 28px;padding:18px 20px;margin:0 0 24px;background:#edf4f1;border-radius:8px}.knowledge-coverage div{min-width:90px}.knowledge-coverage dt{font-size:.8rem;color:#496268}.knowledge-coverage dd{font-size:1.6rem;font-weight:600;margin:2px 0 0}
.knowledge-empty{padding:36px 24px;border:1px dashed #bdcdca;border-radius:8px}.knowledge-exceptions{margin-top:28px;padding:20px;border:1px solid #e4d7be;border-radius:8px;background:#fdfbf7}.knowledge-exceptions details{margin:14px 0}.knowledge-exceptions li{margin:12px 0}.knowledge-exceptions small{display:block;color:#666}
.knowledge-next{display:block;margin:24px 0}.knowledge-record-view{max-width:1040px}.knowledge-record-view .knowledge-navigation{border-bottom:1px solid #d6e0df;padding-bottom:16px}
.knowledge-portal :focus-visible{outline:3px solid #358f87;outline-offset:3px}
.knowledge-control{margin:14px 0}.knowledge-control form{padding:12px 0}.knowledge-control label{display:block;margin:10px 0}.knowledge-control textarea,.knowledge-control select{display:block;width:100%;padding:9px;border:1px solid #bdcdca;border-radius:5px;font:inherit;background:white}.knowledge-control button{padding:9px 14px;border:0;border-radius:5px;background:#215f58;color:white;font:inherit;cursor:pointer}.knowledge-control button:disabled{opacity:.6;cursor:default}.knowledge-control [role=status]{font-size:.85rem}
@media(max-width:700px){.knowledge-portal{padding:18px 14px}.knowledge-grid{grid-template-columns:1fr}.knowledge-card{padding:16px}.knowledge-filter{align-items:stretch}.knowledge-filter button{align-self:end}.knowledge-coverage{gap:12px 20px}.knowledge-tabs{gap:20px}}
</style>
