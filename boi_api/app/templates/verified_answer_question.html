<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>검증 가능한 데이터 질문 · BoI Wiki</title>
  <link rel="stylesheet" href="{{ asset_url('style.css') }}" />
</head>
<body>
{% include "_app_shell.html" %}
<main class="page-content verified-answer-question" id="main-content">
  <nav aria-label="Breadcrumb"><a href="/ontology/migrations">Advanced</a> / <span aria-current="page">데이터 질문</span></nav>
  <header>
    <p class="eyebrow">PROVISIONAL candidate preview</p>
    <h1>검증 가능한 데이터 질문</h1>
    <p>질문은 활성 지식 프로필로 계획하고, 실행 receipt에 결박된 결과만 답변합니다.</p>
  </header>
  <form id="verified-answer-question-form">
    <label for="question">질문</label>
    <textarea id="question" name="question" required></textarea>
    <input type="hidden" name="idempotency_key" id="idempotency-key" />
    <button type="submit">답변 확인</button>
    <p id="answer-form-status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
(() => {
  const form = document.getElementById("verified-answer-question-form");
  const status = document.getElementById("answer-form-status");
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    const question = String(data.get("question") || "");
    const idem = String(data.get("idempotency_key") || `question:${question}`);
    status.textContent = "검증된 결과를 구성하고 있습니다.";
    const response = await fetch("/api/v2/answers/questions", {
      method: "POST",
      headers: {"content-type": "application/json", "x-boi-invocation-channel": "ui"},
      body: JSON.stringify({question, idempotency_key: idem, parameters: {}, purpose: "verified-answer-ui"}),
    });
    if (!response.ok) {
      status.textContent = "이 질문을 현재 프로필과 권한으로 안전하게 답할 수 없습니다.";
      return;
    }
    const answer = await response.json();
    window.location.assign(answer.ui_url);
  });
})();
</script>
</body>
</html>
