<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BoI Agent · BoI Wiki</title>
  <link rel="stylesheet" href="{{ asset_url('style.css') }}" />
  <script type="module" src="{{ asset_url('dist/mermaid-render.js') }}"></script>
  <script src="{{ asset_url('mermaid_collaboration_v2.js') }}" defer></script>
  <script src="{{ asset_url('task_completion_editor.js') }}" defer></script>
  <script src="{{ asset_url('a2ui_renderer.js') }}" defer></script>
  <script type="module" src="{{ asset_url('dist/a2ui-runtime.js') }}"></script>
  <script src="{{ asset_url('agent_workspace_v2.js') }}" defer></script>
</head>
<body>
  {% include "_app_shell.html" %}
  <main
    class="agent-surface-host agent-surface-fullpage"
    data-agent-v2-workspace
    data-surface-kind="fullpage"
    data-page-ref="{{ shell.agent_context.page_ref or request.url.path }}"
    data-selection-ref="{{ shell.agent_context.selection_ref or '' }}"
    data-task-ref="{{ shell.agent_context.task_ref or '' }}"
    data-event-ref="{{ shell.agent_context.event_ref or '' }}"
    data-artifact-ref="{{ shell.agent_context.artifact_ref or '' }}"
    data-person-ref="{{ shell.agent_context.person_ref or '' }}"
    data-document-ref="{{ shell.agent_context.document_ref or '' }}"
    data-action-ref="{{ shell.agent_context.action_ref or '' }}"
    data-sop-ref="{{ shell.agent_context.sop_ref or '' }}"
    data-workflow-ref="{{ shell.agent_context.workflow_ref or '' }}"
    data-org-ref="{{ shell.agent_context.org_ref or '' }}"
    data-agent-ref="{{ shell.agent_context.agent_ref or '' }}"
    data-system-ref="{{ shell.agent_context.system_ref or '' }}"
    data-trace-ref="{{ shell.agent_context.trace_ref or '' }}"
  >
    {% include "_agent_surface_v2.html" %}
  </main>
</body>
</html>
